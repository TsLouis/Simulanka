name: Python CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,server]' types-PyYAML
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest
      - name: Mypy changed seam
        run: >-
          mypy --strict
          src/simulanka/kernel/apply.py
          src/simulanka/server/app.py
          tests/test_add_node_atomic.py
