[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "simulanka"
version = "0.1.0"
description = "Research Graph Kernel for semi-automated scientific workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Simulanka authors" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "python-ulid>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]
torch = [
    "torch>=2.4",
]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
simulanka = "simulanka.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/simulanka"]

[tool.ruff]
line-length = 100
target-version = "py310"
ext-exclude = ["references", "researcher-handoff"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# typer's recommended idiom uses function-call defaults (Argument/Option); not a real bug.
ignore = ["B008"]

[tool.mypy]
# 与唯一开发环境（仓内 .venv，Py3.12）对齐；此前 3.10 在 numpy stubs 的
# PEP 695 `type` 语法上直接 syntax error（numpy 随 SAM2 彩排装入）。
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

# numpy 只是 SAM2 类 baseline 的运行时依赖（本项目代码不直接 import）；
# 其自带 stubs 用了 PEP 695 `type` 语法，在 python_version=3.10 的解析下
# 直接报 syntax error —— 跳过第三方 stub，而非放宽本项目的兼容口径。
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

# Dummy torch.nn.Module subclasses in the importer tests are pure fixtures;
# strict mode otherwise flags them as "subclass of Any".
[[tool.mypy.overrides]]
module = ["tests.test_torch_importer"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
